<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1a56db" />
    <meta name="description" content="Application de suivi du temps - TimeTracking MM" />
    <title>TimeTracking MM</title>
    <base href="/" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="manifest.json" rel="manifest" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
</head>
<body>
    <div id="app">
        <div class="loading-screen">
            <div class="spinner"></div>
            <p>Chargement de TimeTracking...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        Une erreur est survenue. <a href="" class="reload">Recharger</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        function downloadFile(fileName, contentType, base64) {
            var bin = atob(base64);
            var bytes = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            var blob = new Blob([bytes], { type: contentType });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
</body>
</html>
